name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Started by the "Set protocol version" workflow after it commits to a PR
  # branch (its own pushes don't trigger CI).
  workflow_dispatch:

jobs:
  # A PR into main must carry main's protocol version + 1. The "Set protocol
  # version" workflow does that automatically; this is the safety net (fork
  # PRs, a failed run). Make it a required check on main.
  protocol-version:
    name: Protocol version
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dart-lang/setup-dart@v1

      - name: kProtocolVersion is main's + 1
        run: dart tool/protocol_version.dart check --base origin/main

  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          (cd packages/nico_shared && flutter pub get)
          (cd packages/nico_native && flutter pub get)
          (cd web_client && flutter pub get)
          (cd caster && flutter pub get)

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      # Analyzes everything in the repo: the app, both packages, the web client
      # and the Caster (they all live under the repo root).
      - name: Analyze
        run: flutter analyze

      # The shared package must compile for browsers: only the native half of
      # the connection code may import dart:io.
      - name: Shared package stays web-safe
        run: |
          if grep -rln "import 'dart:io'" packages/nico_shared/lib | grep -v "net/channel/connect_io.dart"; then
            echo "dart:io imported in packages/nico_shared (see files above)"; exit 1
          fi

      - name: Test app
        run: flutter test

      - name: Test shared package
        working-directory: packages/nico_shared
        run: flutter test

      - name: Test native package
        working-directory: packages/nico_native
        run: flutter test

      - name: Test Caster app
        working-directory: caster
        run: flutter test

      - name: Test browser client
        working-directory: web_client
        run: flutter test

      # The browser player client the host app serves at /play/. Built here so a
      # broken web build fails the PR, and kept under a size budget because every
      # host app carries it.
      - name: Build browser client
        run: tool/build_web_client.sh

      - name: Browser client size budget (8 MB zipped)
        run: |
          size=$(stat -c%s assets/generated/web_client.zip)
          echo "web_client.zip: $size bytes"
          test "$size" -le 8388608 || { echo 'Over the 8 MB budget'; exit 1; }

      # The host serves game art from its own copy (lib/net/game_art.dart), so
      # it must not be packed into the zip as well.
      - name: Browser client leaves game art to the host
        run: |
          if unzip -l assets/generated/web_client.zip | grep 'assets/packages/nico_shared/'; then
            echo 'nico_shared assets are in web_client.zip (see tool/build_web_client.sh)'; exit 1
          fi

      - name: Test shared package in a browser
        working-directory: packages/nico_shared
        timeout-minutes: 10
        run: flutter test --platform chrome

      # Last, because it changes the checkout: generate a throwaway game and
      # check it passes everything, so tool/new_game.dart can't rot when the
      # game interfaces change.
      - name: New-game generator still produces a passing game
        run: |
          dart run tool/new_game.dart scaffoldcheck "Scaffold Check" 2 5
          dart format --output=none --set-exit-if-changed packages/nico_shared
          flutter analyze
          flutter test test/games test/docs
          (cd packages/nico_shared && flutter test)
