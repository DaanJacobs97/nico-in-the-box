name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Skips the Flutter steps until the app has been scaffolded.
      - name: Check for Flutter project
        id: detect
        run: |
          if [ -f pubspec.yaml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - uses: subosito/flutter-action@v2
        if: steps.detect.outputs.present == 'true'
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        if: steps.detect.outputs.present == 'true'
        run: flutter pub get

      - name: Check formatting
        if: steps.detect.outputs.present == 'true'
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        if: steps.detect.outputs.present == 'true'
        run: flutter analyze

      - name: Test
        if: steps.detect.outputs.present == 'true'
        run: flutter test
