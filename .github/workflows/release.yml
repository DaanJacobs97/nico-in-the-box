name: Release

# Builds installable apps for a version tag and attaches them to a draft
# GitHub Release (visible to collaborators only, as the repository is
# private). Push a tag such as v0.3.1, or v0.3.1-rc1 for a dry run; the part
# before any "-" must match the version in pubspec.yaml. Review the draft,
# then publish it by hand. See "Release builds" in the README.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        name: Tag matches pubspec.yaml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pubspec=$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' pubspec.yaml)
          if [[ "${tag%%-*}" != "$pubspec" ]]; then
            echo "Tag $GITHUB_REF_NAME doesn't match version $pubspec in pubspec.yaml"; exit 1
          fi
          echo "version=$pubspec" >> "$GITHUB_OUTPUT"

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Release key
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      # Fails if an APK ends up signed with the debug key.
      - name: Build and check the APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: tool/release/package_android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: build/release/*.apk
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build the zips (with the Visual C++ runtime)
        run: powershell -ExecutionPolicy Bypass -File tool/release/package_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/release/*.zip
          if-no-files-found: error

  release:
    needs: [version, android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes (changelog section + install notes)
        run: |
          v="${{ needs.version.outputs.version }}"
          awk -v v="$v" 'index($0, "## " v " ") == 1 {on = 1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          { echo; cat .github/release_install_notes.md; } >> notes.md
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--draft --title "Nico in the Box $GITHUB_REF_NAME" --notes-file notes.md)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" dist/*
