name: nico_in_the_box
description: "Jackbox-style LAN party games"
publish_to: 'none'
version: 0.3.1+4

environment:
  sdk: ^3.13.5

dependencies:
  archive: ^4.5.2
  flutter:
    sdk: flutter
  nico_native:
    path: packages/nico_native
  nico_shared:
    path: packages/nico_shared
  qr_flutter: ^4.1.0
  wakelock_plus: ^1.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    # Browser player client, built by tool/build_web_client (git-ignored).
    - assets/generated/
    # Shared screen page served at /screen/ (lightweight HTML/JS).
    - assets/display/
    - assets/display/games/

# App icons, drawn by tool/icons/draw_icons_test.dart. Regenerate with
# `dart run flutter_launcher_icons` after redrawing.
flutter_launcher_icons:
  image_path: icons/app_icon.png
  android: true
  adaptive_icon_background: "#5A3FC0"
  adaptive_icon_foreground: icons/app_icon_foreground.png
  ios: true
  remove_alpha_ios: true
  windows:
    generate: true
    image_path: icons/app_icon.png
    icon_size: 256
