name: nico_shared
description: "Protocol, game engines, client and player screens shared by the Nico in the Box apps. Web-safe."
publish_to: 'none'
version: 0.3.1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  vector_math: ^2.1.4
  web_socket_channel: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tacticalvoxelrpg/slimes/acid/
    - assets/tacticalvoxelrpg/slimes/dark/
    - assets/tacticalvoxelrpg/slimes/fire/
    - assets/tacticalvoxelrpg/slimes/plasma/
    - assets/tacticalvoxelrpg/slimes/water/
